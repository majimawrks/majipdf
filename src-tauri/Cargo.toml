[package]
name = "majipdf"
version = "0.0.0"
description = "Portable, offline PDF toolkit"
edition = "2021"

[lib]
name = "majipdf_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }
sha2 = "0.10"
zip = { version = "8", default-features = false, features = ["deflate"] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
pdfium-render = "0.9"
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
rust_xlsxwriter = "0.99.1"
base64 = "0.22"
lopdf = { version = "0.36", default-features = false }
ttf-parser = "0.25"
flate2 = "1.1" # already in the tree through lopdf; used for capped inflation
sha2 = "0.10"
zip = { version = "8", default-features = false, features = ["deflate"] }

# Accurate OCR (PaddleOCR through ONNX Runtime, loaded from the bundled DLL). Not on macOS: no universal ORT build yet.
[target.'cfg(not(target_os = "macos"))'.dependencies]
paddle-ocr-rs = { version = "0.6.1", default-features = false }
ort = { version = "=2.0.0-rc.10", default-features = false, features = ["load-dynamic", "ndarray"] }

[target.'cfg(windows)'.dependencies]
winreg = "0.5"

[profile.dev.package."*"]
opt-level = 2
